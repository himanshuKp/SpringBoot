spring:
    application:
        name: cacheable

    jpa:
        open-in-view: false
        show-sql: true

    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password: password

    data:
        redis:
            host: localhost
            port: 6379
    
    cache:
        type: redis
        redis:
            time-to-live: 60000
            cache-null-values: false

